version: '3.8'
services:
  linux:
    build:
      context: cobalt/docker/linux
      cache_from:
        - ghcr.io/youtube/cobalt_sandbox/linux:latest
    image: ghcr.io/youtube/cobalt_sandbox/linux:latest
    platform: linux/amd64
  raspi:
    build:
      context: cobalt/docker/raspi
      cache_from:
        - ghcr.io/youtube/cobalt_sandbox/raspi:latest
    image: ghcr.io/youtube/cobalt_sandbox/raspi:latest
    platform: linux/amd64
  unittest:
    build:
      context: cobalt/docker/unittest
      cache_from:
        - ghcr.io/youtube/cobalt_sandbox/unittest:latest
    image: ghcr.io/youtube/cobalt_sandbox/unittest:latest
  webtest:
    build:
      context: cobalt/docker/webtest
      cache_from:
        - ghcr.io/youtube/cobalt_sandbox/webtest:latest
    image: ghcr.io/youtube/cobalt_sandbox/webtest:latest
