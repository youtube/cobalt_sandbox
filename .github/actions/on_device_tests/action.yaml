name: On Device Test
description: Runs on-device tests (Mocked).
inputs:
  nightly:
    description: "Indicates if this is a nightly job."
    required: true
  test_targets_json:
    description: "The test targets in a JSON array."
    required: true
  gcs_results_path:
    description: "GCS path for the test results."
    required: true
  test_results_key:
    description: "Artifact key used to store test results."
    required: true
  test_dimensions:
    description: "Test dimensions JSON string."
    required: true
  test_device_family:
    description: "Test device family."
    required: true
  test_attempts:
    description: "Number of attempts for the tests."
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run Mocked On-Device Tests
      shell: bash
      env:
        JOB_NAME: ${{ matrix.name }}_on_device_tests
        TEST_TARGETS_JSON: ${{ inputs.test_targets_json }}
        PLATFORM: ${{ matrix.platform }}
      run: |
        test_output="${GITHUB_WORKSPACE}/results"
        echo "test_output=${test_output}" >> "${GITHUB_ENV}"
        mkdir -p "${test_output}/${PLATFORM}"

        python3 "${GITHUB_WORKSPACE}/.github/scripts/mock_step.py" \
          --job-name "${JOB_NAME}" \
          --job-type test \
          --output-dir "${test_output}/${PLATFORM}" \
          --test-targets "${TEST_TARGETS_JSON}"

    - name: Archive Test Results
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      if: always()
      with:
        name: ${{ inputs.test_results_key }}
        path: ${{ env.test_output }}/*
