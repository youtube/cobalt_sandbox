name: Set Up Depot Tools
description: Sets up Depot Tools and initializes gclient. Requires source code to be cloned to src/ directory.
inputs:
  run_sync:
    description: "Whether or not to run gclient sync."
    default: "true"
runs:
  using: "composite"
  steps:
      - name: check disk size
        run:  df -h
        shell: bash
      - name: Get depot tools
        run: git clone --single-branch --depth 1 -n https://chromium.googlesource.com/chromium/tools/depot_tools depot_tools && cd depot_tools && git fetch origin a31405a80ca086d1622e985636b2397e9e3ad8a7 && git checkout -b cache a31405a80ca086d1622e985636b2397e9e3ad8a7
        shell: bash
      - name: Bootstrap bundled python3
        run: |
          # Must be run manually as $DEPOT_TOOLS_UPDATE is 0 in CI, skipping the bootstrap.
          source depot_tools/bootstrap_python3 && bootstrap_python3
        shell: bash
      - name: Add depot tools to PATH
        run: echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
        shell: bash
      - name: Generate gclient file
        run: mkdir -p /gclient-sync-cache/git && export DEPOT_TOOLS_UPDATE=0 && gclient config --name=src --custom-var=download_remoteexec_cfg=True --custom-var='rbe_instance="projects/cobalt-actions-prod/instances/default_instance"' --cache-dir=/gclient-sync-cache/git https://github.com/${{ github.repository }}
        shell: bash
      - name: Set target OS for Android
        if: ${{ contains(matrix.platform, 'android') }}
        run: |
          echo "target_os=['android']" >> .gclient
          gclient validate
        shell: bash
      - name: gclient sync
        if: inputs.run_sync == 'true'
        run: export DEPOT_TOOLS_UPDATE=0 && gclient sync -v --shallow --no-history -r ${{ github.sha }} --lock_timeout=700 --timeout=700
        shell: bash
      - name: Disable Chromium client side build telemetry
        run: build_telemetry opt-out
        shell: bash
      - name: check cache
        run: ls -lh /gclient-sync-cache/git
        shell: bash
