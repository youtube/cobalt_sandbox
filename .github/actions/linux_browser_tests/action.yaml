name: Linux Browser Tests
description: Runs browser tests on-host for Linux.
inputs:
  test_artifacts_key:
    description: "Artifact key used to store test artifacts."
    required: true
  test_results_key:
    description: "Artifact key used to store test results."
    required: true
  platform:
    description: "The platform being tested."
    required: true
  config:
    description: "The build config (e.g. devel, qa)."
    required: true
  gcs_results_path:
    description: "GCS path for the test results."
    required: true

runs:
  using: "composite"
  steps:
    - name: Download Artifacts
      uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
      with:
        name: ${{ inputs.test_artifacts_key }}
        path: artifacts

    - name: Run Browser Tests (Mocked)
      shell: bash
      env:
        JOB_NAME: ${{ matrix.name }}_browser_tests_on_host
      run: |
        python3 "${GITHUB_WORKSPACE}/.github/scripts/mock_step.py" \
          --job-name "${JOB_NAME}" \
          --job-type test \
          --output-dir "${GITHUB_WORKSPACE}/results" \
          --test-targets '["cobalt_browsertests"]'

    - name: Upload Browser Test Results to GCS
      if: always() && false
      shell: bash
      env:
        GCS_RESULTS_PATH: ${{ inputs.gcs_results_path }}
      run: |
        if [ -d "${GITHUB_WORKSPACE}/results" ] && [ -n "$(ls -A "${GITHUB_WORKSPACE}/results" 2>/dev/null)" ]; then
          gcloud storage cp -r "${GITHUB_WORKSPACE}/results/"* "${GCS_RESULTS_PATH}/"
        fi

    - name: Archive Browser Test Results
      if: always()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: ${{ inputs.test_results_key }}
        path: results/*
