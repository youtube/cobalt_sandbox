name: linux

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  mock-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Create mock reports
        run: |
          for platform in linux-x64x11 linux-modular linux-web-tests chromium_linux; do
            jq -n \
              --arg platform "$platform" \
              '{
                platform: $platform,
                config: "devel",
                build_result: "success",
                on_device_test_result: "success",
                on_host_test_result: "success",
                web_tests_result: "success",
                e2e_test_result: "success",
                yts_test_result: "success",
                test_failures: {},
                failed: false
              }' > "report_${platform}.json"
          done

      - name: Upload Mock linux-x64x11
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-linux-x64x11
          path: report_linux-x64x11.json

      - name: Upload Mock linux-modular
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-linux-modular
          path: report_linux-modular.json

      - name: Upload Mock linux-web-tests
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-linux-web-tests
          path: report_linux-web-tests.json

      - name: Upload Mock chromium_linux
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-chromium_linux
          path: report_chromium_linux.json
