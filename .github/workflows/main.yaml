# Reusable Cobalt CI workflow (Mocked for CI Shepherd testing).

name: main

on:
  workflow_call:
    inputs:
      platform:
        description: 'Cobalt platform.'
        required: true
        type: string
      nightly:
        description: 'Nightly workflow.'
        required: false
        type: string
        default: 'false'
      run_api_leak_detector:
        description: 'Whether to run the api leak detector.'
        required: false
        type: boolean
        default: false
    secrets:
      datadog_api_key:
        required: false
      sccache_gcs_key:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.platform }}-${{ github.event_name }} @ ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CI_ESSENTIALS: |
    .github
  IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
  IS_NON_DRAFT_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}

jobs:
  initialize:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      PLATFORM: ${{ inputs.platform }}
    timeout-minutes: 5
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github

      - name: Set Configuration Outputs
        id: set-config
        shell: bash
        run: |
          set -euo pipefail
          config_file="${GITHUB_WORKSPACE}/.github/config/${PLATFORM}.json"
          if [ -f "${config_file}" ]; then
            platforms=$(jq -c '.platforms // ["linux-x64x11"]' "${config_file}")
            includes=$(jq -c '.includes // []' "${config_file}")
            if [ "${includes}" = "[]" ] || [ "${includes}" = "null" ]; then
              includes="[{\"name\": \"x64\", \"platform\": \"linux-x64x11\"}]"
            fi
          else
            platforms='["linux-x64x11"]'
            includes='[{"name": "x64", "platform": "linux-x64x11"}]'
          fi

          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "includes=${includes}" >> "$GITHUB_OUTPUT"
          echo "build_runners=[\"ubuntu-latest\"]" >> "$GITHUB_OUTPUT"
          echo "build_configs=[\"devel\"]" >> "$GITHUB_OUTPUT"
          echo "gtest_shards=[0]" >> "$GITHUB_OUTPUT"
          echo "num_gtest_shards=1" >> "$GITHUB_OUTPUT"
          echo "test_on_host=true" >> "$GITHUB_OUTPUT"
          echo "test_on_device=false" >> "$GITHUB_OUTPUT"
          echo "web_tests=false" >> "$GITHUB_OUTPUT"
          echo "test_e2e=false" >> "$GITHUB_OUTPUT"
          echo "test_yts=false" >> "$GITHUB_OUTPUT"
          echo "test_yts_playback=false" >> "$GITHUB_OUTPUT"
          echo "run_browser_tests=false" >> "$GITHUB_OUTPUT"
          echo "test_yts_wpt=false" >> "$GITHUB_OUTPUT"
          echo "expected_tests_json=[]" >> "$GITHUB_OUTPUT"
          echo "run_on_device_test=false" >> "$GITHUB_OUTPUT"
    outputs:
      platforms: ${{ steps.set-config.outputs.platforms }}
      includes: ${{ steps.set-config.outputs.includes }}
      build_runners: ${{ steps.set-config.outputs.build_runners }}
      build_configs: ${{ steps.set-config.outputs.build_configs }}
      gtest_shards: ${{ steps.set-config.outputs.gtest_shards }}
      num_gtest_shards: ${{ steps.set-config.outputs.num_gtest_shards }}
      test_on_host: ${{ steps.set-config.outputs.test_on_host }}
      test_on_device: ${{ steps.set-config.outputs.test_on_device }}
      web_tests: ${{ steps.set-config.outputs.web_tests }}
      test_e2e: ${{ steps.set-config.outputs.test_e2e }}
      test_yts: ${{ steps.set-config.outputs.test_yts }}
      test_yts_playback: ${{ steps.set-config.outputs.test_yts_playback }}
      run_browser_tests: ${{ steps.set-config.outputs.run_browser_tests }}
      test_yts_wpt: ${{ steps.set-config.outputs.test_yts_wpt }}
      expected_tests_json: ${{ steps.set-config.outputs.expected_tests_json }}
      run_on_device_test: ${{ steps.set-config.outputs.run_on_device_test }}

  docker-build-image:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Docker Build Image
        run: echo "Mock docker build image complete"
    outputs:
      docker_tag: mock-tag

  docker-unittest-image:
    if: needs.initialize.outputs.test_on_host == 'true'
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Docker Unittest Image
        run: echo "Mock docker unittest image complete"
    outputs:
      docker_tag: mock-tag

  docker-webtest-image:
    if: needs.initialize.outputs.web_tests == 'true'
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Docker Webtest Image
        run: echo "Mock docker webtest image complete"
    outputs:
      docker_tag: mock-tag

  build:
    needs: [initialize, docker-build-image]
    permissions: {}
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: ${{ fromJson(needs.initialize.outputs.build_configs) }}
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github

      - name: Mock Build Execution
        id: build-step
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          MODE="pass"
          if [ -f ".github/config/infra/mock_ci.json" ]; then
            MODE=$(jq -r '.mode // "pass"' .github/config/infra/mock_ci.json 2>/dev/null || echo "pass")
          fi

          EVENT_TEXT="${HEAD_MSG} ${PR_TITLE} ${PR_BODY}"
          if [[ "${EVENT_TEXT}" =~ \[mock:([a-zA-Z0-9_-]+)\] ]]; then
            MODE="${BASH_REMATCH[1]}"
          fi

          echo "========================================="
          echo "MOCK CI BUILD EXECUTION"
          echo "Job: ${{ matrix.name }}_${{ matrix.config }}"
          echo "Resolved Mode: ${MODE}"
          echo "Run Attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "========================================="

          if [ "${MODE}" = "build_fail" ]; then
            echo "::error::Simulating build failure [mock:build_fail]"
            exit 1
          else
            echo "Simulating successful build"
            exit 0
          fi

  on-host-test:
    needs: [initialize, docker-unittest-image, build]
    if: needs.initialize.outputs.test_on_host == 'true'
    permissions: {}
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_on_host_tests_${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
        shard: ${{ fromJson(needs.initialize.outputs.gtest_shards) }}
    steps:
      - name: Restore CI Essentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github

      - name: Mock Test Execution
        id: test-step
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          MODE="pass"
          if [ -f ".github/config/infra/mock_ci.json" ]; then
            MODE=$(jq -r '.mode // "pass"' .github/config/infra/mock_ci.json 2>/dev/null || echo "pass")
          fi

          EVENT_TEXT="${HEAD_MSG} ${PR_TITLE} ${PR_BODY}"
          if [[ "${EVENT_TEXT}" =~ \[mock:([a-zA-Z0-9_-]+)\] ]]; then
            MODE="${BASH_REMATCH[1]}"
          fi

          echo "========================================="
          echo "MOCK CI TEST EXECUTION"
          echo "Job: ${{ matrix.name }}_on_host_tests_${{ matrix.shard }}"
          echo "Resolved Mode: ${MODE}"
          echo "Run Attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "========================================="

          if [ "${MODE}" = "test_fail" ]; then
            echo "::error::Simulating test failure [mock:test_fail]"
            exit 1
          elif [ "${MODE}" = "flake" ]; then
            if [ "${GITHUB_RUN_ATTEMPT}" -lt 2 ]; then
              echo "::error::Simulating test flake on attempt ${GITHUB_RUN_ATTEMPT} [mock:flake]"
              exit 1
            else
              echo "Simulating test flake recovery on attempt ${GITHUB_RUN_ATTEMPT} [mock:flake]"
              exit 0
            fi
          elif [ "${MODE}" = "flake_fail" ]; then
            echo "::error::Simulating persistent flake failure on attempt ${GITHUB_RUN_ATTEMPT} [mock:flake_fail]"
            exit 1
          elif [ "${MODE}" = "build_fail" ]; then
            echo "Build fail mode - pass if reached"
            exit 0
          else
            echo "Simulating test pass [mock:pass]"
            exit 0
          fi

  on-device-test:
    needs: [initialize, build]
    if: needs.initialize.outputs.run_on_device_test == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_on_device_tests
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Mock On-Device Test
        run: echo "Mock on device test complete"

  web-tests:
    needs: [initialize, docker-webtest-image, build]
    if: needs.initialize.outputs.web_tests == 'true'
    permissions: {}
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_web_tests
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Mock Web Tests
        run: echo "Mock web tests complete"

  e2e-test:
    needs: [initialize, build]
    if: needs.initialize.outputs.test_e2e == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_e2e_tests
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Mock E2E Tests
        run: echo "Mock e2e tests complete"

  yts-test:
    needs: [initialize, build]
    if: needs.initialize.outputs.test_yts == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_yts_tests
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Mock YTS Tests
        run: echo "Mock yts tests complete"

  yts-playback-test:
    needs: [initialize, build]
    if: needs.initialize.outputs.test_yts_playback == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_yts_playback_tests
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Mock YTS Playback Tests
        run: echo "Mock yts playback tests complete"

  browser-test-on-host:
    needs: [initialize, build, docker-unittest-image]
    if: needs.initialize.outputs.run_browser_tests == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_browser_tests_on_host
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Mock Browser Tests
        run: echo "Mock browser tests complete"

  yts-wpt-test:
    needs: [initialize, build]
    if: needs.initialize.outputs.test_yts_wpt == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_yts_wpt_tests
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Mock YTS WPT Tests
        run: echo "Mock yts wpt tests complete"

  test-results:
    needs: [initialize, build, on-device-test, on-host-test]
    if: always() && needs.build.result == 'success' && needs.initialize.outputs.expected_tests_json != '[]'
    permissions: {}
    runs-on: ubuntu-latest
    name: ${{ matrix.test_info.target }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
        test_info: ${{ fromJson(needs.initialize.outputs.expected_tests_json) }}
    steps:
      - name: Mock Test Results
        run: echo "Mock test results"

  browser-test-results:
    needs: [initialize, build, browser-test-on-host]
    if: always() && needs.initialize.outputs.run_browser_tests == 'true' && (needs.browser-test-on-host.result != 'skipped' && needs.browser-test-on-host.result != '')
    permissions: {}
    runs-on: ubuntu-latest
    name: ${{ matrix.test_target }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
        test_target: ["default"]
    steps:
      - name: Mock Browser Test Results
        run: echo "Mock browser test results"

  validate-result:
    needs:
      - initialize
      - build
      - on-device-test
      - on-host-test
      - web-tests
      - e2e-test
      - yts-test
      - yts-playback-test
    if: always() && needs.initialize.result == 'success' && needs.build.result == 'success'
    permissions: {}
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}_tests_passing
    strategy:
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: [devel]
    steps:
      - name: Validate Results
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          ON_HOST_TEST_RESULT: ${{ needs.on-host-test.result }}
          ON_DEVICE_TEST_RESULT: ${{ needs.on-device-test.result }}
          WEB_TESTS_RESULT: ${{ needs.web-tests.result }}
          E2E_TEST_RESULT: ${{ needs.e2e-test.result }}
          YTS_TEST_RESULT: ${{ needs.yts-test.result }}
          YTS_PLAYBACK_TEST_RESULT: ${{ needs.yts-playback-test.result }}
        run: |
          failed_jobs=()
          [ "${ON_HOST_TEST_RESULT}" = "failure" ] || [ "${ON_HOST_TEST_RESULT}" = "cancelled" ] && failed_jobs+=("on-host-test")
          [ "${ON_DEVICE_TEST_RESULT}" = "failure" ] || [ "${ON_DEVICE_TEST_RESULT}" = "cancelled" ] && failed_jobs+=("on-device-test")
          [ "${WEB_TESTS_RESULT}" = "failure" ] || [ "${WEB_TESTS_RESULT}" = "cancelled" ] && failed_jobs+=("web-tests")
          [ "${E2E_TEST_RESULT}" = "failure" ] || [ "${E2E_TEST_RESULT}" = "cancelled" ] && failed_jobs+=("e2e-test")
          [ "${YTS_TEST_RESULT}" = "failure" ] || [ "${YTS_TEST_RESULT}" = "cancelled" ] && failed_jobs+=("yts-test")

          if [ ${#failed_jobs[@]} -gt 0 ]; then
            echo "::error title=Platform Validation Failed::${PLATFORM} has failed jobs: ${failed_jobs[*]}"
            exit 1
          fi
          echo "Platform validation passed for ${PLATFORM}."
        shell: bash
