name: Outside Collaborator

on:
  pull_request_target:
    types:
      - opened
      - reopened

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }} @ ${{ github.event.pull_request.number || github.sha }}'
  cancel-in-progress: true

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Check if PR author is outside collaborator
      uses: actions/github-script@v7
      with:
        script: |
          const author = context.payload.pull_request.user.login;
          

          const { data: permissionData } = await github.rest.repos.getCollaboratorPermissionLevel({
            owner: context.repo.owner,
            repo: context.repo.repo,
            username: author
          });
          
          const permissionLevel = permissionData.role_name;
          console.log(`Permission level for ${author}: ${permissionLevel}`);
          

          if (permissionLevel === 'none' || permissionLevel === 'read') {
            console.log('PR author is an outside collaborator. Adding label...');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['outside collaborator']
            });
          }
