name: mac_build

on:
  workflow_call:
    inputs:
      platform:
        description: 'Cobalt platform.'
        required: true
        type: string
      nightly:
        description: 'Nightly workflow.'
        required: true
        type: string
        default: 'false'
      run_api_leak_detector:
        description: 'Whether to run the api leak detector.'
        required: false
        type: boolean
        default: false
      run_in_docker:
        description: 'Whether to run in docker.'
        required: false
        type: boolean
        default: true
    secrets:
      datadog_api_key:
        required: false

concurrency:
  # Cancel existing jobs on the same workflow, platform, and branch (or sha if merged).
  group: ${{ github.workflow }}-${{ inputs.platform }} @ ${{ github.head_ref || github.sha }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_on_mac:
    if: ${{ !inputs.run_in_docker }}
    needs: [initialize]
    permissions: {}
    runs-on: macos-latest
    name: ${{ matrix.name }}_${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.initialize.outputs.platforms) }}
        include: ${{ fromJson(needs.initialize.outputs.includes) }}
        config: ${{ fromJson(needs.initialize.outputs.build_configs) }}
    env:
      TEST_ARTIFACTS_KEY: ${{ matrix.platform }}_${{ matrix.name }}_test_artifacts
      DEPOT_TOOLS_UPDATE: 0
      DEPOT_TOOLS_REPORT_BUILD: 0
      DEPOT_TOOLS_COLLECT_METRICS: 0
      DEPOT_TOOLS_METRICS: 0
      IS_CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src
          # Set fetch-depth to 2 to make checkout faster for pull requests and cobalt_sandbox repo.
          # Set fetch-dept to 0 for non pull request workflows in production repo which is needed
          # to properly calculate build id.
          fetch-depth: ${{ ( github.event_name == 'pull_request' || github.repository == 'youtube/cobalt_sandbox' ) && 2 || 0 }}
      - uses: 'google-github-actions/auth@v3'
        with:
          project_id: 'cobalt-actions-prod'
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
      - name: Install sccache
        run: brew install sccache
      - name: Configure sccache
        shell: bash
        run: |
          set -x
          echo "${{ secrets.SCCACHE_GCS_KEY }}" | base64 --decode > "${HOME}/gcloud.json"
          echo "SCCACHE_GCS_KEY_PATH=${HOME}/gcloud.json" >> $GITHUB_ENV
          echo "SCCACHE=1" >> $GITHUB_ENV
          echo "SCCACHE_GCS_BUCKET=cobalt-sscache-mac" >> $GITHUB_ENV
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE" >> $GITHUB_ENV
          echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
      - name: Set Up Depot Tools
        uses: ./src/.github/actions/depot_tools
      - name: Install Google Cloud SDK
        run: |
          set -x
          if [[ "$(uname -m)" == "arm64" ]]; then
            GCLOUD_ARCHIVE="google-cloud-cli-darwin-arm.tar.gz"
          else
            GCLOUD_ARCHIVE="google-cloud-cli-darwin-x86_64.tar.gz"
          fi
          mkdir -p "$HOME/.local"
          cd /tmp
          curl -L -O "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/${GCLOUD_ARCHIVE}"
          tar xf "${GCLOUD_ARCHIVE}" -C "$HOME/.local" --strip-components=1 google-cloud-sdk/bin google-cloud-sdk/lib
          rm "${GCLOUD_ARCHIVE}"
          export PATH="$HOME/.local/bin:$PATH"
          gcloud --version
        shell: bash
      - name: Set Up Cloud SDK
        uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6 # v1.1.1
      - name: Set GCS Project Name
        run: |
          echo "PROJECT_NAME=$(gcloud config get-value project)" >> $GITHUB_ENV
        shell: bash
      - name: Check token
        run: |
          gcloud auth print-access-token
      - name: Build Cobalt
        id: build
        uses: ./src/.github/actions/build
        with:
          targets: ${{ needs.initialize.outputs.targets }}
          test_artifacts_key: ${{ env.TEST_ARTIFACTS_KEY }}
          test_root_target: ${{ needs.initialize.outputs.test_root_target }}
          test_targets_json_file: out/${{ matrix.platform }}_${{ matrix.config }}/test_targets.json
          upload_on_host_test_artifacts: ${{ matrix.config == 'devel' && needs.initialize.outputs.test_on_host == 'true' }}
          upload_on_device_test_artifacts: ${{ matrix.config == 'devel' && ( needs.initialize.outputs.test_on_device == 'true' || needs.initialize.outputs.test_e2e == 'true' ) }}
          upload_web_test_artifacts: ${{ matrix.config == 'devel' && needs.initialize.outputs.web_tests == 'true' }}
